name: Docs Build Check

# Fast pre-merge check: build the MkDocs site with --strict (fails on broken
# internal links or pages missing from the nav). Does not deploy.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements/docs.txt'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements/docs.txt
      - run: mkdocs build --strict
