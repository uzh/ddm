name: Docs Build Check

# Fast pre-merge check: build the MkDocs site with --strict (fails on broken
# internal links or pages missing from the nav). Does not deploy.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --group docs
      - run: uv run mkdocs build --strict
