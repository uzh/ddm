# Runs a build test every time a commit is pushed to branch 'develop'.
# Runs a build test and merges develop into main every time a tag with pattern 'v*' is pushed.

name: Merge to Main

on:
  push:
    tags:
      - 'v*'

jobs:
  build-test:
    uses: ./.github/workflows/test-ddm.yml
    secrets: inherit

  docs-version:
    needs: build-test
    if: success()
    runs-on: ubuntu-latest
    outputs:
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - id: v
        # v3.0.4 -> 3.0
        run: |
          ref="${GITHUB_REF_NAME#v}"
          echo "minor=${ref%.*}" >> "$GITHUB_OUTPUT"

  publish-docs:
    needs: docs-version
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: ${{ needs.docs-version.outputs.minor }}
      alias: latest

  merge-dev:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: everlytic/branch-merge@1.1.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_ref: 'develop'
          target_branch: 'main'
          commit_message_template: '[Automated] Merged {source_ref} into target {target_branch}'
