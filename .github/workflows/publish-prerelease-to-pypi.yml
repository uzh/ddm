# Runs a build test every time a commit is pushed to branch 'main'.

name: Test and Publish Pre-Release Version of Python Package

on:
  push:
    tags:
      - 'pre*'

jobs:

  test-ddm:
    uses: ./.github/workflows/test-ddm.yml
    secrets: inherit
    with:
      db-matrix: '["mysql"]'

  publish-docs:
    needs: test-ddm
    if: success()
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: dev
      title: dev (develop)

  deploy:
    needs: test-ddm
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish
