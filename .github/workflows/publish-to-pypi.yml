# Runs a build test every time a commit is pushed to branch 'main'.

name: Test and Publish Python Package

on:
  push:
    branches: [ main ]

  workflow_run:
    workflows: [ Merge to Main ]
    types:
      - completed

jobs:
  build-test:
    uses: ./.github/workflows/test-ddm.yml
    secrets: inherit
    with:
      db-matrix: '["mysql"]'

  # Docs for a release are published from the "Merge to Main" workflow when the
  # v* tag is pushed; nothing to do here.

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish
