# Runs a build test every time a commit is pushed to branch 'main'.

name: Test and Publish Python Package

on:
  push:
    branches: [ main ]

  workflow_run:
    workflows: [ Merge to Main ]
    types:
      - completed

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        db: [mysql]
        python-version: [3.12, 3.14]
        include:
          - db: mysql
            db_port: 3306
            db_engine: django.db.backends.mysql
            db_user: root

    services:
      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ddmtestdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install psycopg2 mysqlclient
          pip install -r requirements/dev.txt

      - name: Run Tests With ${{ matrix.db }}
        env:
          DB: ${{ matrix.db }}
          DB_ENGINE: ${{ matrix.db_engine }}
          DB_NAME: ddmtestdb
          DB_USER: ${{ matrix.db_user }}
          DB_PASSWORD: password
          DB_PORT: ${{ matrix.db_port }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python test_project/manage.py test ddm

  # Docs for a release are published from the "Merge to Main" workflow when the
  # v* tag is pushed; nothing to do here.

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Generate new setup.cfg
        run: bash version_bump.sh

      - name: Build package
        run: python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
