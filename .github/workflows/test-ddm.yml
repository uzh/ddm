name: Test DDM

# Reusable: runs the Django test suite against a db x python-version matrix.
# Dependencies are installed with uv from the committed uv.lock, so this uses
# exactly the same resolved versions as local development.

on:
  workflow_call:
    inputs:
      db-matrix:
        description: 'JSON array of db backends to test against, e.g. ["sqlite", "mysql"]'
        required: false
        type: string
        default: '["sqlite", "mysql"]'
    secrets:
      SECRET_KEY:
        required: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        db: ${{ fromJSON(inputs.db-matrix) }}
        python-version: [3.12, 3.14]
        include:
          - db: sqlite
            db_engine: django.db.backends.sqlite3

          - db: mysql
            db_port: 3306
            db_engine: django.db.backends.mysql
            db_user: root

    services:
      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ddmtestdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev --group db-drivers

    - name: Run Tests With ${{ matrix.db }}
      env:
        DB: ${{ matrix.db }}
        DB_ENGINE: ${{ matrix.db_engine }}
        DB_NAME: ddmtestdb
        DB_USER: ${{ matrix.db_user }}
        DB_PASSWORD: password
        DB_PORT: ${{ matrix.db_port }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: uv run python test_project/manage.py test ddm
