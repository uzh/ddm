<form method='post'>
  {% csrf_token %}
  {{ form.media }}

  <div>
    <input type="hidden" id="delete-token" name="action" value="delete">
    <button
        class="ddm-btn ddm-btn-red"
        data-bs-toggle="modal"
        data-bs-target="#delete-token-modal"
        type="button"
    >
      Delete Token
    </button>
    <span class="mb-0 ps-2">Delete current token to create a new one.</span>
  </div>

  {% include "ddm_auth/_token_delete_modal.html" %}

</form>
