{% if override_standard_errors %}
  <div class="alert alert-danger" role="alert">
    The form contains some errors. Please see below and address them.
  </div>
{% else %}
  {% if form.errors %}
    <div class="alert alert-danger" role="alert">
      The form contains some errors. Please see below and address them.
    </div>
  {% endif %}
{% endif %}
