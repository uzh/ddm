<div id="delete-blueprint-section" class="ddm-section-container">
  <div class="row">
    <div class="form-section-heading">
      <h2>Copy Blueprint</h2>
    </div>

    <div class="col-auto">
      <form
        method="post"
        action="{% url 'ddm_datadonation:blueprints:copy' object.project.url_id object.pk %}"
        onsubmit="this.querySelector('button').disabled = true;"
      >
        {% csrf_token %}
        <button
          class="ddm-btn-base ddm-btn-secondary"
          type="submit"
        >
          Create a copy of this Blueprint
        </button>
      </form>
    </div>

  </div>
</div>
