<p class="mt-0">
  When a file has been identified, it is validated in order:
</p>
<ol class="mb-2 mt-2">
  <li><strong>Format correct</strong>: The file matches the expected file format.</li>
  <li><strong>Fields present</strong>: The file contains all expected fields.</li>
</ol>
<p class="mt-0">
  If any step fails, no data is extracted and the participant sees an error explaining what went wrong.
</p>
