<div class="border-bottom">
  <div class="container py-3">
    <div class="row align-items-center">
      <div class="col-6 col-sm-3 col-md-4 order-0 text-start text-sm-center">
        {% if project.img_header_left or default_header_right %}
          <img
            class="float-md-start project-logo project-logo-left"
            src="
              {% if project.img_header_left %}{{ project.img_header_left.url }}{% elif default_header_left %}{{ default_header_left }}{% endif %}"
            alt="Project Logo Left"
          />
        {% endif %}
      </div>

      <div class="col-12 col-sm-6 col-md-4 order-2 order-sm-1 text-center project-title pt-4 pt-sm-0">
        {{ project.name }}
      </div>

      <div class="col-6 col-sm-3 col-md-4 order-1 order-sm-2 text-end text-sm-center">
        {% if project.img_header_right or default_header_right %}
          <img
            class="float-md-end project-logo project-logo-right"
            src="
              {% if project.img_header_right %}{{ project.img_header_right.url }}{% elif default_header_right %}{{ default_header_right }}{% endif %}"
            alt="Project Logo Right"
          />
        {% endif %}
      </div>
    </div>
  </div>
</div>
