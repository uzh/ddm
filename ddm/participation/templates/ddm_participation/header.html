<div class="border-bottom">
  <div class="container py-3">
    <div class="row align-items-center">
      <div class="col text-center">
        {% if project.img_header_left or default_header_right %}
          <img
            class="float-md-start"
            src="
              {% if project.img_header_left %}{{ project.img_header_left.url }}{% elif default_header_left %}{{ default_header_left }}{% endif %}"
            height="60px"
            alt="Project Logo Left"
          />
        {% endif %}
      </div>

      <div class="col text-center">
        {{ project.name }}
      </div>

      <div class="col text-center">
        {% if project.img_header_right or default_header_right %}
          <img
            class="float-md-end"
            src="
              {% if project.img_header_right %}{{ project.img_header_right.url }}{% elif default_header_right %}{{ default_header_right }}{% endif %}"
            height="60px"
            alt="Project Logo Right"
          />
        {% endif %}
      </div>
    </div>
  </div>
</div>
