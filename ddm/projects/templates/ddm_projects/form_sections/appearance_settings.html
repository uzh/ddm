{% for field in form %}
  {% if field.name in "img_header_left,img_header_right" %}

    <div class="mb-3 fs-09">
      <p class="ddm-form-group-header">{{ field.label }}</p>

      <div class="ddm-form-group fs-09 ">
        {% if field.value %}
          <div class="row mb-3">
            <div class="col-auto"><label>Current file:</label> <a href="{{ field.value.url }}" target="_blank"><img src="{{ field.value.url }}" alt="current image file" height="50px"/></a></div>
            <div class="col"><label for="{{ field.name }}-clear_id">Reset:</label> <input type="checkbox" name="{{ field.name }}-clear" id="{{ field.name }}-clear_id"></div>
          </div>
        {% endif %}
        <div>
          <label for="formFileSm" class="form-label">Upload new:</label>
          <input class="form-control form-control-sm" type="file" name="{{ field.name }}" id="id_{{ field.name }}">
        </div>
      </div>
    </div>

  {% endif %}
{% endfor %}
