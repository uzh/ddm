[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ddm"
version = "3.0.0b5"
description = "A Django app to set up data donation projects."
readme = "README.md"
license = { text = "GPLv3" }
authors = [
    { name = "Nico Pfiffner", email = "n.pfiffner@ikmz.uzh.ch" },
]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Django>=5.2,<6",
    "pycryptodome",
    "pydantic>=2,<3",
    "django-ckeditor-5",
    "django-filter",
    "django-polymorphic",
    "django-webpack-loader",
    "djangorestframework",
    "nh3",
    "sqlparse",
    "asgiref",
]

[project.urls]
Homepage = "https://github.com/uzh/ddm"
Documentation = "https://uzh.github.io/ddm/"
Website = "https://datadonation.uzh.ch"

[dependency-groups]
dev = [
    "coverage",
    "django-browser-reload",
    "django-csp",
    "django-debug-toolbar",
    "django-watchfiles",
    "pandas",
    "pip-audit",
    "pre-commit",
    "python-dotenv",
    "ruff",
    "selenium",
    "webdriver_manager",
]
docs = [
    "mkdocs-material",
    "mike",
    "mkdocs-redirects",
]
db-drivers = [
    "psycopg2-binary",
    "mysqlclient",
]

[tool.setuptools.packages.find]
include = ["ddm*"]

[tool.setuptools]
include-package-data = true

# ==== Coverage ====
[tool.coverage.run]
include = ["ddm/**"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*"
]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
fail_under = 80

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"

extend-exclude = [
    "*.html",
    "*/migrations/*.py",
    "staticfiles/*",
    "docs/*",
    "frontend/*",
    "tools/screenshots/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    # "ARG", # Unused function argument
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    # "NPY",
    # "AIR",
    "PERF",
    # "FURB",
    # "LOG",
    "RUF",
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    "FBT001",
    "COM812",
    "ANN002", # Annotation of function *args arguments
    "ANN003", # Annotation of function *kwargs arguments
]
# The fixes in extend-unsafe-fixes will require
# provide the `--unsafe-fixes` flag when fixing.
extend-unsafe-fixes = [
    "UP038",
]

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.lint.per-file-ignores]
"test*.py" = ["SLF001", "PLR2004", "FBT003", "PT009", "S106", "PT027", "S105", "ANN"]
"**/test_project/*" = ["INP001"]
